# 我们的方法：可学习通道图 + 环境不变性（V-REx），暂不开 TTA。
# 这是消融链条的中间点：先证明「通道图 + 不变性」有用，再加 TTA。
model:
  name: ours
  params:
    window: 64
    stride: 4
    epochs: 20
    batch_size: 128
    lr: 0.001
    weight_decay: 0.00001
    hidden: 64
    latent: 32
    dropout: 0.0
    topk: 3
    gamma_init: 0.1
    init_std: 0.01
    sparsity: 0.001
    n_env: 4
    env_penalty: 0.1
    tta: false
    tta_finetune: false
    seed: 42
    verbose: true